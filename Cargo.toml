[workspace]
resolver = "3"
members = ["crates/gitcore", "crates/app"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
gitcore = { path = "crates/gitcore" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# GPUI renders on the CPU side too: keep dependencies optimised in dev builds.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
