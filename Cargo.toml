[workspace]
resolver = "3"
members = ["crates/gitcore", "crates/app"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
gitcore = { path = "crates/gitcore" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# GPUI renders on the CPU side too: keep dependencies optimised in dev builds.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
# GPUI is big; thin LTO keeps release builds (and CI) from taking half an hour.
codegen-units = 16
lto = "thin"
opt-level = 3
strip = true
