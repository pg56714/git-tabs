[workspace]
resolver = "3"
members = ["crates/gitcore", "crates/devserver", "src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
gitcore = { path = "crates/gitcore" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
