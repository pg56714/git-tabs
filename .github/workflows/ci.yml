# Tests on every push and pull request, and a trial packaging run on all three systems
# (nothing is published; the installers are kept as workflow artifacts).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libasound2-dev libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libvulkan-dev libssl-dev libzstd-dev libgbm-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            formats: nsis
          - os: macos-latest
            formats: dmg
          - os: ubuntu-24.04
            formats: appimage,deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libasound2-dev libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libvulkan-dev libssl-dev libzstd-dev \
            libgbm-dev libfuse2t64 patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked
      - name: Build
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cargo build --release -p git-tabs --target aarch64-apple-darwin
            cargo build --release -p git-tabs --target x86_64-apple-darwin
            lipo -create -output target/release/git-tabs \
              target/aarch64-apple-darwin/release/git-tabs target/x86_64-apple-darwin/release/git-tabs
          else
            cargo build --release -p git-tabs
          fi
      - name: Package
        working-directory: crates/app
        run: cargo packager --release --formats ${{ matrix.formats }}
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
