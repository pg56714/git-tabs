# Run by hand from the Actions tab ("Run workflow"). It works out the next version from the
# Conventional Commits since the last tag, commits CHANGELOG.md and the version bump, tags it,
# builds Windows / macOS / Linux, and publishes the release once every build has uploaded.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.version.outputs.skip }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2

      - name: Next version and changelog
        id: version
        run: bun scripts/release.ts

      - name: Commit, tag and open a draft release
        id: draft
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md Cargo.toml Cargo.lock
          git commit -m "chore(release): $TAG"
          git tag "$TAG"
          git push origin "HEAD:${GITHUB_REF_NAME}" "$TAG"
          # A draft until every platform has uploaded; the last job publishes it. Creating it
          # through the API returns the id straight away (a draft is not found by tag name).
          RELEASE_ID=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="$TAG" -f name="git-tabs $TAG" -F draft=true -F body=@release-notes.md \
            --jq .id)
          test -n "$RELEASE_ID"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            formats: nsis
          - os: macos-latest
            formats: dmg
          - os: ubuntu-24.04
            formats: appimage,deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libasound2-dev libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libvulkan-dev libssl-dev libzstd-dev \
            libgbm-dev libfuse2t64 patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            # One universal binary for Apple Silicon and Intel.
            cargo build --release -p git-tabs --target aarch64-apple-darwin
            cargo build --release -p git-tabs --target x86_64-apple-darwin
            lipo -create -output target/release/git-tabs \
              target/aarch64-apple-darwin/release/git-tabs target/x86_64-apple-darwin/release/git-tabs
          else
            cargo build --release -p git-tabs
          fi

      - name: Package
        working-directory: crates/app
        run: cargo packager --release --formats ${{ matrix.formats }}

      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          mkdir -p upload
          cp dist/*.exe dist/*.dmg dist/*.AppImage dist/*.deb upload/ 2>/dev/null || true
          # The bare .exe runs without installing.
          if [ "$RUNNER_OS" = "Windows" ]; then cp target/release/git-tabs.exe upload/git-tabs_windows_x64.exe; fi
          ls -la upload
          test -n "$(ls upload)"
          for f in upload/*; do
            name=$(basename "$f")
            echo "uploading $name"
            gh api --method POST \
              -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${name}" \
              --input "$f" > /dev/null
          done

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${{ needs.prepare.outputs.release_id }}" \
            -F draft=false -F make_latest=true > /dev/null
