# Run by hand from the Actions tab ("Run workflow"). It works out the next version from the
# Conventional Commits since the last tag, commits CHANGELOG.md and the version bump, tags it,
# builds Windows / macOS / Linux, and publishes the release once every build has uploaded.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.version.outputs.skip }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2

      - name: Next version and changelog
        id: version
        run: bun scripts/release.ts

      - name: Commit, tag and open a draft release
        id: draft
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md package.json Cargo.toml Cargo.lock src-tauri/tauri.conf.json
          git commit -m "chore(release): $TAG"
          git tag "$TAG"
          git push origin "HEAD:${GITHUB_REF_NAME}" "$TAG"
          # A draft until every platform has uploaded; the last job publishes it.
          gh release create "$TAG" --draft --title "git-tabs $TAG" --notes-file release-notes.md
          echo "release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id")" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
            plain: true
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            plain: false
          - os: ubuntu-22.04
            args: --bundles appimage,deb
            plain: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tauriScript: bun run tauri
          args: ${{ matrix.args }}
          # Windows also gets the bare .exe, which runs without installing.
          uploadPlainBinary: ${{ matrix.plain }}

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ needs.prepare.outputs.tag }}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
