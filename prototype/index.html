<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>git-tabs 原型</title>
<style>
:root{--bg:#eef0f3;--panel:#fff;--panel2:#f6f7f9;--hover:#eef1f5;--text:#1d2129;--muted:#5f6672;--faint:#9aa1ad;--border:#e1e4e8;--accent:#2f6fdf;--accentbg:#e5eeff;--accenttx:#1f4fae;
--addbg:#e7f6ea;--addw:#abe0b7;--delbg:#fdecea;--delw:#f5bdb7;--hunk:#eef2f8;--kw:#a626a4;--str:#2b7a3b;--com:#8a8f98;--num:#b5651d;--warn:#a86a10;--warnbg:#fdf1d6;--ok:#2b7a3b;--okbg:#e2f3e5;--danger:#c0362c;--lane0:#2f6fdf;--lane1:#1d9e75;--lane2:#d85a30;--shadow:0 8px 28px rgba(0,0,0,.14)}
:root[data-theme=dark]{--bg:#16181c;--panel:#1e2126;--panel2:#24282e;--hover:#2b3037;--text:#e4e7eb;--muted:#a3aab5;--faint:#6c7480;--border:#33383f;--accent:#5b8ff0;--accentbg:#22324f;--accenttx:#a9c4fb;
--addbg:#1d3324;--addw:#2f6a3d;--delbg:#3d2224;--delw:#7a3434;--hunk:#232b38;--kw:#d792e0;--str:#8fd19e;--com:#7b828d;--num:#e3a36b;--warn:#e5b45a;--warnbg:#3b3020;--ok:#8fd19e;--okbg:#1d3324;--danger:#ff8a80;--shadow:0 8px 28px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.45 "Segoe UI","Microsoft JhengHei UI",system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
.mono{font-family:"Cascadia Mono",Consolas,"JetBrains Mono",monospace}
#app{display:grid;grid-template-rows:36px 42px minmax(0,1fr) auto;height:100vh}
#tabs{display:flex;align-items:flex-end;gap:2px;padding:0 6px;background:var(--bg);overflow-x:auto;scrollbar-width:none}
.tab{display:flex;align-items:center;gap:7px;height:30px;padding:0 10px 0 12px;border-radius:8px 8px 0 0;color:var(--muted);cursor:pointer;white-space:nowrap;user-select:none;max-width:240px}
.tab:hover{background:var(--hover)}
.tab.on{background:var(--panel);color:var(--text)}
.tab .x{opacity:0;border:0;background:none;cursor:pointer;color:var(--faint);padding:0 2px}
.tab:hover .x,.tab.on .x{opacity:1}
.dirty{width:7px;height:7px;border-radius:50%;background:#e8a33a;flex:none}
.sub{font-size:11.5px;color:var(--faint)}
.up{color:var(--accent)}.down{color:var(--warn)}
#toolbar{display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--border)}
.btn{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border:1px solid var(--border);border-radius:7px;background:var(--panel);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.on{background:var(--accentbg);border-color:transparent;color:var(--accenttx)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{height:24px;padding:0 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--hover)}
.sep{width:1px;height:20px;background:var(--border);margin:0 2px}
.grow{flex:1}
kbd{font:11px "Cascadia Mono",Consolas,monospace;padding:1px 5px;border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;color:var(--muted);background:var(--panel2)}
#main{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:0}
#side{background:var(--panel2);border-right:1px solid var(--border);overflow:auto;padding:8px 0;user-select:none}
.nav{display:flex;align-items:center;gap:8px;margin:1px 8px;padding:5px 8px;border-radius:6px;cursor:pointer;color:var(--muted)}
.nav:hover{background:var(--hover)}
.nav.on{background:var(--accentbg);color:var(--accenttx)}
.nav .n{margin-left:auto;font-size:11.5px}
.sh{display:flex;align-items:center;gap:4px;padding:10px 14px 3px;font-size:11.5px;color:var(--faint);cursor:pointer}
.sh:hover{color:var(--muted)}
.si{display:flex;align-items:center;gap:6px;margin:0 8px;padding:3px 8px 3px 18px;border-radius:6px;cursor:pointer;color:var(--muted);white-space:nowrap;overflow:hidden}
.si:hover{background:var(--hover)}
.si .n{margin-left:auto;font-size:11.5px}
.si .act{display:none;margin-left:auto}
.si:hover .act{display:flex;gap:2px}
.si:hover .act~.n{display:none}
#content{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--panel)}
.cbar{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:7px;overflow:hidden}
.seg button{border:0;background:none;padding:3px 10px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--border)}
.seg button.on{background:var(--accentbg);color:var(--accenttx)}
.review{display:grid;grid-template-columns:290px minmax(0,1fr);flex:1;min-height:0}
.fp{border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.fpscroll{flex:1;overflow:auto;padding-bottom:8px}
.fsec{display:flex;align-items:center;gap:6px;padding:8px 10px 4px;font-size:12px;color:var(--muted);position:sticky;top:0;background:var(--panel);z-index:1}
.prog{height:3px;background:var(--border);margin:0 10px 6px;border-radius:2px}
.prog div{height:3px;background:var(--accent);border-radius:2px;transition:width .2s}
.tr{display:flex;align-items:center;gap:6px;padding:2px 10px;cursor:pointer;white-space:nowrap;border-radius:5px;margin:0 6px}
.tr:hover{background:var(--hover)}
.tr.on{background:var(--accentbg);color:var(--accenttx)}
.tr.dir{color:var(--muted);cursor:default}
.tr.dir:hover{background:none}
.tr.seen .nm{color:var(--faint);text-decoration:line-through}
.tr .ck{margin-left:auto;color:var(--ok);font-size:12px}
.st{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:4px;font-size:10.5px;font-weight:600;flex:none}
.st.M{background:var(--warnbg);color:var(--warn)}.st.A{background:var(--okbg);color:var(--ok)}.st.D{background:var(--delbg);color:var(--danger)}.st.R{background:var(--accentbg);color:var(--accenttx)}
.cbox{border-top:1px solid var(--border);padding:8px;display:flex;flex-direction:column;gap:6px}
.cbox input:not([type=checkbox]),.cbox textarea,.field{width:100%;border:1px solid var(--border);border-radius:7px;background:var(--panel2);padding:5px 8px;outline:none}
.cbox input:focus,.cbox textarea:focus,.field:focus{border-color:var(--accent)}
.cbox textarea{height:54px;resize:vertical}
.err{color:var(--danger);font-size:12px}
.dv{display:flex;flex-direction:column;min-width:0;min-height:0}
.dhead{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--border);min-height:40px}
.dhead .path{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.add-n{color:var(--ok);font-size:12px}.del-n{color:var(--danger);font-size:12px}
.dbody{flex:1;overflow:auto;font:12.5px/1.6 "Cascadia Mono",Consolas,monospace}
.dl{display:grid;grid-template-columns:44px 44px minmax(0,1fr)}
.dl>span:nth-child(-n+2){color:var(--faint);text-align:right;padding-right:8px;user-select:none;border-right:1px solid var(--border)}
.dl>span:nth-child(2){border-right:1px solid var(--border)}
.dl .code{white-space:pre;padding-left:10px}
.wrap .dl .code,.wrap .sl .code{white-space:pre-wrap;word-break:break-all}
.dl.add,.sl .add{background:var(--addbg)}.dl.del,.sl .del{background:var(--delbg)}
.dl.add>span:nth-child(-n+2),.dl.del>span:nth-child(-n+2){color:var(--muted)}
.hh{background:var(--hunk);color:var(--muted);padding:3px 10px;position:sticky;top:0;z-index:1}
.hh.cur{box-shadow:inset 3px 0 var(--accent)}
.wa{background:var(--addw);border-radius:2px}.wd{background:var(--delw);border-radius:2px}
.k{color:var(--kw)}.s{color:var(--str)}.c{color:var(--com);font-style:italic}.nu{color:var(--num)}
.sbs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.sl{display:grid;grid-template-columns:44px minmax(0,1fr);min-height:20px}
.sl>span:first-child{color:var(--faint);text-align:right;padding-right:8px;border-right:1px solid var(--border);user-select:none}
.sl .code{white-space:pre;padding-left:10px;overflow:hidden}
.sl.blank{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--panel2) 6px 12px)}
.sbs>.col+.col{border-left:1px solid var(--border)}
.empty{display:grid;place-items:center;flex:1;color:var(--muted);text-align:center;padding:40px}
.empty i{font-style:normal;font-size:30px;display:block;margin-bottom:6px;color:var(--faint)}
.hist{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,46%);flex:1;min-height:0}
.clist{overflow:auto;border-right:1px solid var(--border)}
.cr{display:grid;grid-template-columns:52px minmax(0,1fr) 92px 64px 74px;align-items:center;height:28px;padding-right:10px;cursor:pointer;border-bottom:1px solid transparent}
.cr:hover{background:var(--hover)}
.cr.on{background:var(--accentbg)}
.cr .msg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr .meta{color:var(--muted);font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ref{display:inline-block;font-size:11px;padding:0 6px;border-radius:9px;margin-right:4px;background:var(--okbg);color:var(--ok);border:1px solid transparent}
.ref.remote{background:var(--accentbg);color:var(--accenttx)}
.ref.head{border-color:var(--ok);font-weight:600}
.ref.tag{background:var(--warnbg);color:var(--warn)}
.cdet{display:flex;flex-direction:column;min-height:0}
.cmeta{padding:12px 14px;border-bottom:1px solid var(--border)}
.cmeta h3{margin:0 0 6px;font-size:14.5px;font-weight:600}
.kv{display:grid;grid-template-columns:52px 1fr;gap:2px 8px;font-size:12px;color:var(--muted)}
.kv b{font-weight:400;color:var(--text)}
.link{color:var(--accent);cursor:pointer}
.cfiles{max-height:30%;overflow:auto;border-bottom:1px solid var(--border);padding:4px 0}
#log{background:var(--panel2);border-top:1px solid var(--border);font-size:12px}
#log .bar{display:flex;align-items:center;gap:8px;padding:3px 10px;color:var(--muted);cursor:pointer;height:26px}
#log .list{max-height:160px;overflow:auto;padding:4px 10px 8px;font:12px/1.6 "Cascadia Mono",Consolas,monospace}
#log .ok{color:var(--ok)}
#overlay{position:fixed;inset:0;display:none;z-index:50}
#overlay.on{display:block}
#overlay.dim{background:rgba(10,12,16,.35)}
.modal{position:absolute;left:50%;top:12vh;transform:translateX(-50%);width:min(560px,92vw);background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.modal h2{font-size:15px;margin:0;padding:14px 16px 10px}
.modal .body{padding:0 16px 14px;display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow:auto}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px;border-top:1px solid var(--border);background:var(--panel2)}
.modal label.row{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:10px}
.pal input{width:100%;border:0;border-bottom:1px solid var(--border);padding:14px 16px;font-size:15px;background:none;outline:none}
.pal .items{max-height:50vh;overflow:auto;padding:6px}
.pi{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;cursor:pointer}
.pi.on{background:var(--accentbg);color:var(--accenttx)}
.pi .g{margin-left:auto;font-size:11.5px;color:var(--faint)}
.menu{position:absolute;min-width:220px;background:var(--panel);border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow);padding:5px}
.mi{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;cursor:pointer;white-space:nowrap}
.mi:hover{background:var(--hover)}
.mh{padding:6px 10px 2px;font-size:11.5px;color:var(--faint)}
#toast{position:fixed;right:16px;bottom:44px;display:flex;flex-direction:column;gap:8px;z-index:60}
.t{background:var(--text);color:var(--panel);padding:8px 14px;border-radius:8px;box-shadow:var(--shadow);animation:in .18s ease-out}
@keyframes in{from{transform:translateY(8px);opacity:0}}
.idc{font-size:10.5px;padding:0 6px;border-radius:9px;line-height:16px;flex:none;background:var(--cb);color:var(--ct);white-space:nowrap}
.idc.u{background:var(--warnbg);color:var(--warn)}
.c-blue{--cb:#e3edff;--ct:#1f4fae}.c-green{--cb:#e0f3e4;--ct:#25703a}.c-amber{--cb:#fbefd5;--ct:#8a5a0c}.c-red{--cb:#fde4e1;--ct:#a8322a}
.c-purple{--cb:#eeeafd;--ct:#5641b5}.c-teal{--cb:#dcf3ee;--ct:#0f6e5e}.c-pink{--cb:#fbe5ef;--ct:#99335a}.c-gray{--cb:#ecedef;--ct:#4a4f57}
:root[data-theme=dark] .c-blue{--cb:#22324f;--ct:#a9c4fb}:root[data-theme=dark] .c-green{--cb:#1d3324;--ct:#8fd19e}:root[data-theme=dark] .c-amber{--cb:#3b3020;--ct:#e5b45a}:root[data-theme=dark] .c-red{--cb:#3d2224;--ct:#ff9a90}
:root[data-theme=dark] .c-purple{--cb:#2e2850;--ct:#c3b7fb}:root[data-theme=dark] .c-teal{--cb:#173631;--ct:#7fd8c6}:root[data-theme=dark] .c-pink{--cb:#3e2231;--ct:#f0a3c3}:root[data-theme=dark] .c-gray{--cb:#30343a;--ct:#c4c9d0}
.sw{width:18px;height:18px;border-radius:50%;border:0;padding:0;cursor:pointer;background:var(--ct)}
.sw.on{outline:2px solid var(--text);outline-offset:2px}
.mi.on{background:var(--accentbg);color:var(--accenttx)}
.mi .acc{margin-left:auto;padding-left:16px;font-size:11.5px;color:var(--faint)}
.modal.wide{width:min(820px,94vw)}
.mtabs{display:flex;gap:4px;padding:0 16px 10px;border-bottom:1px solid var(--border);margin-bottom:12px}
.card{border:1px solid var(--border);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card .top{display:flex;align-items:center;gap:8px}
.card label.row{grid-template-columns:90px 1fr}
.rule{display:grid;grid-template-columns:150px 1fr auto;gap:6px;align-items:center}
.okline{font:12px "Cascadia Mono",Consolas,monospace;color:var(--ok);background:var(--okbg);border-radius:6px;padding:4px 8px}
.warnline{font-size:12px;color:var(--warn);background:var(--warnbg);border-radius:6px;padding:6px 8px}
.pub{font:11.5px "Cascadia Mono",Consolas,monospace;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:6px 8px;word-break:break-all}
.hint{font-size:11.5px;color:var(--faint);padding:4px 10px;border-top:1px solid var(--border);display:flex;gap:12px;flex-wrap:wrap}
</style>
</head>

function treeHtml(files, list, seenKey) {
  const root = { d: {}, f: [] };
  treeSort(files).forEach(f => { const p = f.path.split('/'); let n = root; p.slice(0, -1).forEach(x => n = n.d[x] = n.d[x] || { d: {}, f: [] }); n.f.push(f); });
  const rows = [];
  const walk = (n, depth) => {
    Object.entries(n.d).forEach(([name, c]) => {
      while (Object.keys(c.d).length === 1 && c.f.length === 0) { const [k, v] = Object.entries(c.d)[0]; name += '/' + k; c = v; }
      rows.push(`<div class="tr dir" style="padding-left:${10 + depth * 14}px">▾ 📁 ${esc(name)}</div>`); walk(c, depth + 1);
    });
    n.f.forEach(f => {
      const on = S.sel && S.sel.list === list && S.sel.path === f.path, seen = R().seen.has(seenKey + f.path);
      rows.push(`<div class="tr ${on ? 'on' : ''} ${seen ? 'seen' : ''}" data-act="pick" data-list="${list}" data-path="${esc(f.path)}" style="padding-left:${10 + depth * 14}px"><span class="st ${f.st}">${f.st}</span><span class="nm">${esc(f.path.split('/').pop())}</span>${seen ? '<span class="ck">✓</span>' : ''}</div>`);
    });
  };
  walk(root, 0); return rows.join('');
}

  switch: d => { const r = R(); if (d.b === r.branch) return; r.branch = d.b; r.ahead = d.b === 'main' ? 0 : 2; run('switch ' + d.b, '已切換到 ' + d.b); closeOverlay(); render(); },
  branchmenu: (d, e) => {
    const r = R(), b = $('brbtn').getBoundingClientRect(); const o = $('overlay'); o.className = 'on';
    o.innerHTML = `<div class="menu" data-stop style="left:${b.left}px;top:${b.bottom + 4}px"><div class="mh">本地分支</div>${r.branches.map(x => `<div class="mi" data-act="switch" data-b="${esc(x)}">${x === r.branch ? '✓' : '&nbsp;&nbsp;'} ${esc(x)}</div>`).join('')}<div class="mh">遠端</div>${r.remote.map(x => `<div class="mi" style="color:var(--muted)">&nbsp;&nbsp; ${esc(x)}</div>`).join('')}<div style="border-top:1px solid var(--border);margin:4px 0"></div><div class="mi" data-act="newbranch">＋ 新增分支…</div></div>`;
  },
  newbranch: () => modal(`<h2>新增分支</h2><div class="body"><label class="row">從<span class="mono">${esc(R().branch)}</span></label><label class="row">名稱<input class="field" id="bn" placeholder="feat/brand-status"></label><div class="err" id="be"></div><label class="sub"><input type="checkbox" id="bsw" checked> 建好就切換過去</label></div><div class="foot"><button class="btn" data-act="close">取消</button><button class="btn primary" id="bok">建立</button></div>`, () => {
    const go = () => { const n = $('bn').value.trim(), r = R(); if (!n) return $('be').textContent = '輸入分支名稱'; if (/\s/.test(n)) return $('be').textContent = '分支名稱不能有空白'; if (r.branches.includes(n)) return $('be').textContent = '這個分支已經存在'; r.branches.push(n); run(($('bsw').checked ? 'switch -c ' : 'branch ') + n, '已建立 ' + n); if ($('bsw').checked) { r.branch = n; r.ahead = 0; } closeOverlay(); render(); };
    $('bn').focus(); $('bn').oninput = () => $('be').textContent = ''; $('bn').onkeydown = e => e.key === 'Enter' && go(); $('bok').onclick = go;
  }),
  rangepick: () => {},
  merge: () => { const r = R(); confirmBox('Merge', `把 <b>${esc(r.rangeBranch)}</b> merge 進 <b>main</b>？`, () => { run(`switch main && git merge --no-ff ${r.rangeBranch}`, '已 merge ' + r.rangeBranch); }); },
  commitpick: d => { S.selCommit = +d.i; S.selCFile = 0; renderContent(); },
  cfile: d => { S.selCFile = +d.i; renderContent(); },
  cop: d => { const c = R().commits[S.selCommit]; run(`${d.op} ${c ? c.sha : ''}`, d.op + ' 完成（原型示範，沒有真的執行）'); renderLog(); },
  reset: () => { const c = R().commits[S.selCommit]; modal(`<h2>Reset 到 ${c.sha}</h2><div class="body"><label><input type="radio" name="rm" value="soft"> soft：保留修改，而且保持已 stage</label><label><input type="radio" name="rm" value="mixed" checked> mixed：保留修改，取消 stage（預設）</label><label style="color:var(--danger)"><input type="radio" name="rm" value="hard"> hard：丟掉所有修改，無法復原</label></div><div class="foot"><button class="btn" data-act="close">取消</button><button class="btn primary" id="rok">Reset</button></div>`, () => { $('rok').onclick = () => { const m = document.querySelector('[name=rm]:checked').value; closeOverlay(); run(`reset --${m} ${c.sha}`, `已 reset --${m}（原型示範）`); renderLog(); }; }); },
  copy: d => { navigator.clipboard?.writeText(d.t).catch(() => {}); toast('已複製 ' + d.t); },
  palette: () => palette(),
  openin: () => { run(`(explorer D:\\project\\${R().name})`,'已在檔案總管開啟（原型示範）'); renderLog(); },
  console: () => { toast('會在這個 repo 開 Windows Terminal（原型示範）'); },
  theme: () => { S.theme = { system: 'light', light: 'dark', dark: 'system' }[S.theme]; applyTheme(); toast('外觀：' + { system: '跟系統', light: '淺色', dark: '深色' }[S.theme]); renderToolbar(); },
  log: () => { S.logOpen = !S.logOpen; renderLog(); },
  close: () => closeOverlay(),
  addrepo: () => modal(`<h2>加入 repo</h2><div class="body"><div class="sub">掃描 D:\\project 找到這些還沒開的 repo：</div>${MORE_REPOS.map(n => `<label><input type="checkbox" value="${esc(n)}"> ${esc(n)} <span class="sub">D:\\project\\${esc(n)}</span></label>`).join('')}<button class="btn sm" style="align-self:flex-start">選其他資料夾…</button><button class="btn sm" style="align-self:flex-start">Clone…</button><label class="row" style="grid-template-columns:90px 1fr">身分<select class="field" id="aid"><option value="">自動（依規則）</option>${S.ids.map(id => `<option value="${id.id}">${esc(id.name)}（${esc(id.account)}）</option>`).join('')}</select></label></div><div class="foot"><button class="btn" data-act="close">取消</button><button class="btn primary" id="aok">加入</button></div>`, () => {
    $('aok').onclick = () => { const picked = [...document.querySelectorAll('#overlay input:checked')].map(x => x.value), pin = $('aid').value || null; picked.forEach(n => { MORE_REPOS.splice(MORE_REPOS.indexOf(n), 1); REPOS.push({ name: n, pin, url: `git@github.com:sam/${n}.git`,branch: 'main', ahead: 0, behind: 0, branches: ['main'], remote: ['origin/main'], tags: [], stashes: [], worktrees: [], changes: [], commits: mkCommits(['init', 'first strategy draft', 'backtest notes'], { 0: ['main', 'origin/main'] }), seen: new Set(), range: {}, rangeBranch: null }); }); closeOverlay(); if (picked.length) { switchTab(REPOS.length - 1); toast(`已加入 ${picked.length} 個 repo`); } };
  }),
  settings: d => { S.setTab = (d && d.tab) || S.setTab; S._snap = JSON.stringify({ ids: S.ids, def: S.defaultId, set: S.settings }); openSettings(); },
  idmenu: () => {
    const r = R(), b = $('idbtn').getBoundingClientRect(), auto = autoIdOf(r), o = $('overlay'); o.className = 'on';
    o.innerHTML = `<div class="menu" style="right:${Math.max(8, innerWidth - b.right)}px;top:${b.bottom + 4}px;min-width:300px"><div class="mh">這個 repo（${esc(r.name)}）用哪個身分</div>
      <div class="mi ${!r.pin ? 'on' : ''}" data-act="idpick" data-id="">${!r.pin ? '●' : '○'} 自動（依規則）<span class="acc">${auto ? '目前是 ' + esc(auto.name) : '沒有符合的規則'}</span></div>
      ${S.ids.map(id => `<div class="mi ${r.pin === id.id ? 'on' : ''}" data-act="idpick" data-id="${id.id}">${r.pin === id.id ? '●' : '○'} <span class="idc ${idCls(id)}">${esc(tagOf(id))}</span> ${esc(id.name)}<span class="acc mono">${esc(id.account || '未驗證')}</span></div>`).join('')}
      <div style="border-top:1px solid var(--border);margin:4px 0"></div><div class="mi" data-act="settings" data-tab="ids">⚙ 管理身分…</div></div>`;
  },
  idpick: d => {
    const r = R(), id = S.ids.find(x => x.id === d.id), p = 'D:/project/' + r.name;
    if (!d.id) { if (r.pin) { run(`-C ${p} config --unset core.sshCommand`); run(`-C ${p} config --unset user.email`); } r.pin = null; const a = autoIdOf(r); toast(`${r.name} 改回自動` + (a ? `：${a.name}` : '（沒有符合的規則，會用預設）')); }
    else { r.pin = id.id; run(`-C ${p} config core.sshCommand "ssh -i ${id.key.replace(/\\/g, '/')} -o IdentitiesOnly=yes"`); run(`-C ${p} config user.email ${id.email}`); toast(`${r.name} 改用 ${id.name}（${id.account}）`); }
    closeOverlay(); render();
  },
  settab: d => { S.setTab = d.tab; openSettings(); },
  setcancel: () => { const s = JSON.parse(S._snap); S.ids = s.ids; S.defaultId = s.def; S.settings = s.set; closeOverlay(); },
  setsave: () => {
    for (const id of S.ids) if (!/^\S+@\S+\.\S+$/.test(id.email)) { $('s-err').textContent = `「${id.name}」的 email 格式不對`; return; }
    if (S.setTab === 'general') { S.settings.git = $('s-git').value; S.settings.fetch = $('s-fetch').value; S.theme = $('s-theme').value; applyTheme(); }
    S.ids.forEach(id => {
      const f = `~/.gitconfig-${id.id === 'e' ? 'emu' : id.id === 'p' ? 'personal' : id.id}`;
      id.rules.filter(r => r.v).forEach(r => run(r.t === 'remote' ? `config --global includeIf."hasconfig:remote.*.url:git@${r.v.replace('/', ':').replace(/\*$/, '**')}".path ${f}` : `config --global includeIf."gitdir/i:${r.v.replace(/\\/g, '/')}".path ${f}`));
      run(`config -f ${f} core.sshCommand "ssh -i ${id.key.replace(/\\/g, '/')} -o IdentitiesOnly=yes"`); run(`config -f ${f} user.email ${id.email}`);
    });
    closeOverlay(); toast('設定已儲存，寫進 git 的 includeIf'); render();
  },
  idtest: d => { const id = S.ids[+d.i]; id.test = 'run'; openSettings(); run(`(ssh -T -i ${id.key.replace(/\\/g, '/')} git@github.com)`); setTimeout(() => { id.test = 'ok'; id.verified = true; if (!id.account) id.account = 'new_account'; if ($('overlay').classList.contains('on')) openSettings(); renderLog(); }, 700); },
  idgen: d => { const id = S.ids[+d.i]; id.gen = !id.gen; if (id.gen && !id.pub) { id.key = id.key || `C:\\Users\\user\\.ssh\\id_ed25519_${id.id}`; id.pub = 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI' + Math.random().toString(36).slice(2, 14) + 'q7XvJ0kY2mFhR8tWz3 ' + id.email; run(`(ssh-keygen -t ed25519 -C ${id.email} -f ${id.key.replace(/\\/g, '/')})`); } openSettings(); },
  idcopy: d => { const id = S.ids[+d.i]; navigator.clipboard?.writeText(id.pub).catch(() => {}); toast('已複製公鑰'); },
  idgh: () => toast('會打開 github.com/settings/ssh/new，讓你自己貼上公鑰（原型示範）'),
  iddel: d => { const id = S.ids[+d.i]; if (S.ids.length === 1) return toast('至少要留一個身分'); S.ids.splice(+d.i, 1); if (S.defaultId === id.id) S.defaultId = S.ids[0].id; openSettings(); },
  idcolor: d => { S.ids[+d.i].color = d.c; openSettings(); },
  idadd: () => { const n = S.ids.length + 1, used = S.ids.map(x => x.color); S.ids.push({ id: 'x' + n, short: '', color: COLORS.find(c => !used.includes(c)) || 'gray', name: '新身分 ' + n, key: '', account: '', verified: false, user: 'Sam', email: '', rules: [{ t: 'remote', v: '' }] }); openSettings(); const cards = document.querySelectorAll('#overlay .card'); cards[cards.length - 1]?.scrollIntoView({ block: 'nearest' }); },
  ruleadd: d => { S.ids[+d.i].rules.push({ t: 'remote', v: '' }); openSettings(); },
  ruledel: d => { S.ids[+d.i].rules.splice(+d.r, 1); openSettings(); },
};
function matchedNames(id) { return REPOS.filter(r => idOf(r) === id).map(r => r.name); }
function unmatchedHtml() {
  const un = REPOS.filter(r => !idOf(r));
  if (!un.length) return '<div class="okline">✓ 開著的 repo 都有對應的身分</div>';
  return un.map(r => `<div class="warnline" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span><b>${esc(r.name)}</b>（${esc(normUrl(r.url))}）沒有對應的身分，會用預設</span><span class="grow"></span>
    <select class="field" style="width:auto;padding:2px 6px" data-assign="${esc(r.name)}"><option value="">指定給…</option>${S.ids.map((id, i) => `<option value="${i}">${esc(id.name)}</option>`).join('')}</select></div>`).join('');
}
function refreshMatches() {
  S.ids.forEach((id, i) => { const el = document.querySelector(`[data-match="${i}"]`); if (el) { const m = matchedNames(id); el.textContent = m.length ? m.join('、') : '（目前沒有開著的 repo 符合）'; } });
  const u = $('unm'); if (u) u.innerHTML = unmatchedHtml();
}
function openSettings() {
  const s = S.settings, tab = S.setTab;
  const tabs = `<div class="mtabs"><div class="seg"><button class="${tab === 'ids' ? 'on' : ''}" data-act="settab" data-tab="ids">身分與 SSH key</button><button class="${tab === 'general' ? 'on' : ''}" data-act="settab" data-tab="general">一般</button></div></div>`;
  const ids = `<div class="sub">依照 remote 網址或資料夾自動選身分。儲存時寫進 git 的 <span class="mono">includeIf</span>，所以終端機和 Claude 執行的 git 也會用同一個身分。</div>
    ${S.ids.map((id, i) => `<div class="card">
      <div class="top"><input class="field" style="width:160px;font-weight:600" data-idf="name" data-i="${i}" value="${esc(id.name)}"><span class="idc ${idCls(id)}" data-chip="${i}">${esc(tagOf(id))}</span>
        <span class="sub">${id.verified ? `<span style="color:var(--ok)">✓ 已驗證</span> GitHub 帳號 <b class="mono">${esc(id.account)}</b>` : '尚未驗證這把 key 對應哪個帳號'}</span><span class="grow"></span><button class="btn sm ghost" data-act="iddel" data-i="${i}" title="刪除這個身分">🗑</button></div>
      <div class="row" style="display:grid;grid-template-columns:90px 1fr;align-items:center;gap:10px"><span>標籤</span><span style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <input class="field" style="width:110px" maxlength="6" data-idf="short" data-i="${i}" value="${esc(id.short || '')}" placeholder="${esc(autoShort(id.name))}" data-shortph="${i}">
        <span class="sub">留空會自動用「<span data-autotag="${i}">${esc(autoShort(id.name))}</span>」</span><span class="grow"></span>
        ${COLORS.map(c => `<button class="sw c-${c} ${id.color === c ? 'on' : ''}" data-act="idcolor" data-i="${i}" data-c="${c}" title="${c}" aria-label="顏色 ${c}"></button>`).join('')}</span></div>
      <label class="row">SSH key<span style="display:flex;gap:6px"><input class="field mono" data-idf="key" data-i="${i}" value="${esc(id.key)}" placeholder="C:\\Users\\user\\.ssh\\id_ed25519_xxx"><button class="btn sm">選檔案…</button><button class="btn sm" data-act="idtest" data-i="${i}">測試連線</button><button class="btn sm ${id.gen ? 'on' : ''}" data-act="idgen" data-i="${i}">產生新 key</button></span></label>
      ${id.test === 'run' ? '<div class="sub">連線中…</div>' : id.test === 'ok' ? `<div class="okline">Hi ${esc(id.account)}! You've successfully authenticated, but GitHub does not provide shell access.</div>` : ''}
      ${id.gen ? `<div style="display:flex;flex-direction:column;gap:6px;padding:8px;border:1px dashed var(--border);border-radius:8px"><div class="sub">已產生 <span class="mono">${esc(id.key)}</span>。私鑰只留在這台電腦。把下面的公鑰貼到這個 GitHub 帳號的 SSH keys：</div><div class="pub">${esc(id.pub)}</div><div style="display:flex;gap:6px"><button class="btn sm" data-act="idcopy" data-i="${i}">複製公鑰</button><button class="btn sm" data-act="idgh">打開 GitHub 新增 SSH key 頁面</button><span class="sub" style="align-self:center">貼好之後按「測試連線」</span></div></div>` : ''}
      <label class="row">user.name<input class="field" data-idf="user" data-i="${i}" value="${esc(id.user)}"></label>
      <label class="row">user.email<input class="field" data-idf="email" data-i="${i}" value="${esc(id.email)}" placeholder="name@example.com"></label>
      <div class="sub">什麼時候用這個身分（符合任一條）</div>
      ${id.rules.map((ru, j) => `<div class="rule"><select class="field" style="padding:3px 6px" data-rulet="${j}" data-i="${i}"><option value="remote" ${ru.t === 'remote' ? 'selected' : ''}>remote 網址符合</option><option value="dir" ${ru.t === 'dir' ? 'selected' : ''}>資料夾在底下</option></select><input class="field mono" data-rule="${j}" data-i="${i}" value="${esc(ru.v)}" placeholder="${ru.t === 'remote' ? 'github.com/your-org/*' : 'D:\\work\\'}"><button class="btn sm ghost" data-act="ruledel" data-i="${i}" data-r="${j}" title="刪除規則">×</button></div>`).join('')}
      <div style="display:flex;align-items:center;gap:8px"><button class="btn sm" data-act="ruleadd" data-i="${i}">＋ 規則</button><span class="sub">目前對應：<span data-match="${i}"></span></span></div>
    </div>`).join('')}
    <div style="display:flex;gap:8px;align-items:center"><button class="btn" data-act="idadd">＋ 新增身分</button><span class="grow"></span><span class="sub">都沒對應時用</span><select class="field" style="width:auto;padding:3px 6px" data-defid>${S.ids.map(id => `<option value="${id.id}" ${id.id === S.defaultId ? 'selected' : ''}>${esc(id.name)}</option>`).join('')}</select></div>
    <div id="unm" style="display:flex;flex-direction:column;gap:6px"></div>`;
  const general = `<label class="row">外觀<select class="field" id="s-theme"><option value="system">跟系統</option><option value="light">淺色</option><option value="dark">深色</option></select></label>
    <label class="row">git 路徑<input class="field mono" id="s-git" value="${esc(s.git)}"></label>
    <label class="row">背景 fetch<select class="field" id="s-fetch"><option value="0">不要</option><option value="5">每 5 分鐘</option><option value="10">每 10 分鐘</option><option value="30">每 30 分鐘</option></select></label>
    <label class="row">Clone 預設位置<input class="field mono" value="D:\\project"></label>
    <div class="sub">HTTPS 的 repo 用 Git Credential Manager 存帳號 token；網址帶帳號名稱（https://帳號@github.com/…）就能分開存。</div>`;
  const o = $('overlay'); o.className = 'on dim';
  o.innerHTML = `<div class="modal wide"><h2>設定</h2>${tabs}<div class="body">${tab === 'ids' ? ids : general}<div class="err" id="s-err"></div></div><div class="foot"><button class="btn" data-act="setcancel">取消</button><button class="btn primary" data-act="setsave">儲存</button></div></div>`;
  if (tab === 'general') { $('s-theme').value = S.theme; $('s-fetch').value = s.fetch; }
  refreshMatches();
}
document.addEventListener('input', e => {
  const t = e.target, i = +t.dataset.i;
  if (t.dataset.idf) { S.ids[i][t.dataset.idf] = t.value; if (t.dataset.idf === 'key') { S.ids[i].verified = false; S.ids[i].test = null; }
    if (t.dataset.idf === 'name' || t.dataset.idf === 'short') { const id = S.ids[i], a = autoShort(id.name); document.querySelector(`[data-chip="${i}"]`).textContent = tagOf(id); document.querySelector(`[data-autotag="${i}"]`).textContent = a; document.querySelector(`[data-shortph="${i}"]`).placeholder = a; } if ($('s-err')) $('s-err').textContent = ''; }
  if (t.dataset.rule !== undefined) { S.ids[i].rules[+t.dataset.rule].v = t.value; refreshMatches(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.rulet !== undefined) { const ru = S.ids[+t.dataset.i].rules[+t.dataset.rulet]; ru.t = t.value; openSettings(); }
  if (t.dataset.defid !== undefined) S.defaultId = t.value;
  if (t.dataset.assign && t.value !== '') { const r = REPOS.find(x => x.name === t.dataset.assign); S.ids[+t.value].rules.push({ t: 'remote', v: normUrl(r.url).replace(/\/[^/]+$/, '/*') }); openSettings(); }
});
document.addEventListener('click', e => {
  if (e.target.id === 'overlay') return document.querySelector('#overlay .modal.wide') ? act.setcancel() : closeOverlay();
  const t = e.target.closest('[data-act]'); if (!t) return;
  if (t.tagName === 'SELECT') return;
  const a = act[t.dataset.act]; if (a) { if (t.dataset.act === 'seen') { e.preventDefault(); } a(t.dataset, e); }
});
document.addEventListener('change', e => { if (e.target.dataset.act === 'rangepick') { R().rangeBranch = e.target.value; S.sel = null; render(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') return document.querySelector('#overlay .modal.wide') ? act.setcancel() : closeOverlay();
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); return palette(); }
  if (e.ctrlKey && /^[1-9]$/.test(e.key)) { e.preventDefault(); return switchTab(+e.key - 1); }
  if (e.ctrlKey && e.key === 'Tab') { e.preventDefault(); return switchTab((S.cur + (e.shiftKey ? REPOS.length - 1 : 1)) % REPOS.length); }
  if ($('overlay').classList.contains('on') || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'j') moveSel(1); else if (k === 'k') moveSel(-1); else if (k === 'n') gotoHunk(1); else if (k === 'p') gotoHunk(-1);
  else if (k === 's') toggleStage(); else if (k === 'v') toggleSeen();
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
applyTheme(); render();
</script>
